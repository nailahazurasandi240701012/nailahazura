<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Membuat Form</title>
</head>
<body>
    <form action="#">
   
    <fieldset>
    <legend><b>Data Pengguna</b></legend>
    <label for="Username">Username</label>
    <input type="username" name="name" /><br />
    <label for="sandi"> Password </label>
    <input type="password" name="sandi" id="sandi" /><br /><br />
    <label for="tgllahir">Tanggal Lahir</label>
    <input type="date" name="tgllahir" id="tgllahir" /><br /><br />
    <label for="alamat">Alamat Rumah</label>
    <textarea name="alamat" id="alamat" cols="20" rows="4"> </textarea><br />
    <label for="umur">Umur</label>
    <input type="number" name="umur" id="umur" min="17" max="70" /><br />
    <label for="prodi">Program Studi</label><br />
    <select name="prodi" id="prodi"
        <option value="Manajemen">S1 Manajemen</option>
        <option value="Teknik Sipil">S1 Teknik Sipil</option>
        <option value="Sastra Inggris">S1 Sastra Inggris</option>
        <option value="Perpustakaan">S1 Perpustakaan</option>
        <option value="Farmasi">S1 Farmasi</option></select><br /><br />
    </fieldset>
    <button type="submit" name="btnDaftar">Daftar</button>
    <input type="reset" value="Reset" name="btnReset" />
</form>
</body>
</html>
